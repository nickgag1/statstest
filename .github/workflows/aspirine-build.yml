# Triggered 2026-08-22 for Aspirine Ultimate 2.2 RC
name: Build and publish Aspirine IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Aspirine-Ultimate-2.2-RC-source.zip'
      - '.aspirine-ci/overrides/**'
      - '.github/workflows/aspirine-build.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: extract
        name: Extract reviewed source and apply validated overrides
        run: |
          set -euxo pipefail
          rm -rf src
          mkdir src
          unzip -q Aspirine-Ultimate-2.2-RC-source.zip -d src
          cp .aspirine-ci/overrides/SystemPlistAccess.swift src/Aspirine/Models/SystemPlistAccess.swift
          cp .aspirine-ci/overrides/RecoveryPackage.swift src/Aspirine/Models/RecoveryPackage.swift
          cp .aspirine-ci/overrides/RuntimeProbe.swift src/Aspirine/Models/RuntimeProbe.swift
          test -s src/Aspirine/Models/SystemPlistAccess.swift
          test -s src/Aspirine/Models/RecoveryPackage.swift
          test -s src/Aspirine/Models/RuntimeProbe.swift

      - id: toolchain
        name: Select Xcode
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swiftc --version

      - id: xcodegen
        name: Install XcodeGen
        run: |
          set -euxo pipefail
          brew install xcodegen
          xcodegen --version

      - id: validate
        name: Validate source
        working-directory: src
        run: |
          set -euxo pipefail
          python3 tools/validate_source.py | tee source-validation.txt
          find Aspirine -name '*.swift' -type f -print0 | while IFS= read -r -d '' file; do swiftc -parse "$file"; done
          plutil -lint Aspirine/App/Info.plist
          ruby -e 'require "yaml"; YAML.load_file("project.yml"); puts "project.yml: PASS"'
          bash -n build-unsigned.sh

      - id: project
        name: Generate project
        working-directory: src
        run: |
          set -euxo pipefail
          xcodegen generate
          xcodebuild -project Aspirine.xcodeproj -scheme Aspirine -showBuildSettings > build-settings.txt
          grep -E 'PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_VERSION|TARGETED_DEVICE_FAMILY|MARKETING_VERSION|CURRENT_PROJECT_VERSION' build-settings.txt

      - id: debugbuild
        name: Debug device compile
        working-directory: src
        run: |
          set -euxo pipefail
          xcodebuild \
            -project Aspirine.xcodeproj \
            -scheme Aspirine \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild-debug.log

      - id: analyze
        name: Static analyzer
        working-directory: src
        run: |
          set -euxo pipefail
          xcodebuild \
            -project Aspirine.xcodeproj \
            -scheme Aspirine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-analyze \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            analyze | tee xcodebuild-analyze.log

      - id: releasebuild
        name: Build unsigned IPA
        working-directory: src
        run: |
          set -euxo pipefail
          ./build-unsigned.sh | tee xcodebuild-release.log
          test -s Aspirine-unsigned.ipa
          shasum -a 256 Aspirine-unsigned.ipa | tee Aspirine-unsigned.ipa.sha256

      - id: inspect
        name: Inspect IPA
        working-directory: src
        run: |
          set -euxo pipefail
          rm -rf ipa-inspect
          mkdir ipa-inspect
          unzip -t Aspirine-unsigned.ipa | tee ipa-unzip-test.txt
          unzip -q Aspirine-unsigned.ipa -d ipa-inspect
          APP='ipa-inspect/Payload/Aspirine.app'
          test -d "$APP"
          test -x "$APP/Aspirine"
          /usr/bin/file "$APP/Aspirine" | tee ipa-binary.txt
          lipo -info "$APP/Aspirine" | tee -a ipa-binary.txt
          lipo -info "$APP/Aspirine" | grep -F 'arm64'
          xcrun otool -L "$APP/Aspirine" | tee ipa-linked-libraries.txt
          /usr/bin/strings "$APP/Aspirine" > ipa-strings.txt
          grep -Fq '24A5390f' ipa-strings.txt
          grep -Fq 'iPhone14,7' ipa-strings.txt
          grep -Fq 'iPhone16,1' ipa-strings.txt
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'app.aspirine.ultimate.db4'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = '2.2.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '220'
          test "$(find ipa-inspect/Payload -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" = '1'
          test -z "$(find ipa-inspect -type f -name '*.mobileprovision' -print -quit)"
          shasum -a 256 -c Aspirine-unsigned.ipa.sha256

      - id: artifact
        name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aspirine-Ultimate-2.2-RC-unsigned
          path: |
            src/Aspirine-unsigned.ipa
            src/Aspirine-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - id: publish
        name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='aspirine-2.2-rc'
          TITLE='Aspirine Ultimate 2.2 RC'
          NOTES='Unsigned arm64 IPA built and validated by GitHub Actions. Download Aspirine-unsigned.ipa and sign/install it with Sideloadly.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" src/Aspirine-unsigned.ipa src/Aspirine-unsigned.ipa.sha256 --clobber
          else
            gh release create "$TAG" src/Aspirine-unsigned.ipa src/Aspirine-unsigned.ipa.sha256 --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi

      - name: Write machine-readable build status
        if: always()
        env:
          EXTRACT: ${{ steps.extract.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          XCODEGEN: ${{ steps.xcodegen.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PROJECT: ${{ steps.project.outcome }}
          DEBUGBUILD: ${{ steps.debugbuild.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          RELEASEBUILD: ${{ steps.releasebuild.outcome }}
          INSPECT: ${{ steps.inspect.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          keys = ['EXTRACT','TOOLCHAIN','XCODEGEN','VALIDATE','PROJECT','DEBUGBUILD','ANALYZE','RELEASEBUILD','INSPECT','ARTIFACT','PUBLISH']
          payload = {
            'source_commit': os.environ.get('GITHUB_SHA',''),
            'run_id': os.environ.get('GITHUB_RUN_ID',''),
            'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT',''),
            'steps': {k.lower(): os.environ.get(k,'') for k in keys},
          }
          pathlib.Path('.aspirine-build-status.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .aspirine-build-status.json
          git commit -m 'ci: record Aspirine build status [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
